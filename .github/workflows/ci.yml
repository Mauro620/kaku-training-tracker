name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: rendimiento
          POSTGRES_USER: rendimiento
          POSTGRES_PASSWORD: rendimiento
        ports:
          - 5432:5432
        # Los tests corren contra Postgres real: columnas generadas, enums
        # nativos y EXTRACT(EPOCH ...) no existen en SQLite.
        options: >-
          --health-cmd "pg_isready -U rendimiento"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: rendimiento
      POSTGRES_USER: rendimiento
      POSTGRES_PASSWORD: rendimiento
      SEED_USUARIO_NOMBRE: CI
      SEED_USUARIO_EMAIL: ci@example.com
      SEED_USUARIO_PASSWORD: ci-solo-para-ci-no-usar-en-prod
      JWT_SECRET_KEY: clave-de-ci-no-usar-en-produccion

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock

      - name: Instalar dependencias
        run: uv sync --frozen --directory apps/api

      - name: Lint y tipos
        run: make lint

      - name: Migraciones
        run: make migrate

      # Falla si los modelos y la migración se separaron: es el error que
      # aparece cuando alguien toca un modelo y se olvida de migrar.
      - name: Verificar que no hay deriva de esquema
        run: uv run --directory apps/api alembic check

      - name: Seeds
        run: make seed

      - name: Tests
        run: make test
