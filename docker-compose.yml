services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rendimiento}
      POSTGRES_USER: ${POSTGRES_USER:-rendimiento}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rendimiento}
      TZ: ${TZ:-America/Bogota}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - datos_db:/var/lib/postgresql/data
    healthcheck:
      # Sin esto el api arranca contra una base que todavía no acepta
      # conexiones y el primer request muere por una razón que no es la real.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rendimiento}"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ./apps/api
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-rendimiento}
      POSTGRES_USER: ${POSTGRES_USER:-rendimiento}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rendimiento}
      SEED_USUARIO_NOMBRE: ${SEED_USUARIO_NOMBRE:-Mauro}
      SEED_USUARIO_EMAIL: ${SEED_USUARIO_EMAIL:-}
      SEED_USUARIO_PASSWORD: ${SEED_USUARIO_PASSWORD:-}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-15}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-30}
      APP_ENV: ${APP_ENV:-local}
      DEBUG: ${DEBUG:-true}
      TZ: ${TZ:-America/Bogota}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./apps/api:/srv

  web:
    build:
      # El contexto es la raíz del monorepo porque pnpm necesita ver
      # pnpm-workspace.yaml, package.json raíz y packages/contracts.
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      # En el celular, el front apunta al api por la IP del host. En este
      # compose el api vive en otro contenedor, asi que usamos el nombre de
      # servicio. Para el navegador del dev en :3000, la URL es la del host.
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:${API_PORT:-8000}/api/v1}
      TZ: ${TZ:-America/Bogota}
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      - api
    volumes:
      # Bind mount para hot reload en dev. El node_modules queda dentro del
      # contenedor (no se monta) porque depende del OS y la version de pnpm.
      - ./apps/web:/srv/apps/web

volumes:
  datos_db:
