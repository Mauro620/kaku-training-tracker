services:
  db:
    image: postgres:16-alpine
    env_file:
      - .env.local
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - datos_db:/var/lib/postgresql/data
    healthcheck:
      # Sin esto el api arranca contra una base que todavía no acepta
      # conexiones y el primer request muere por una razón que no es la real.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rendimiento}"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ./apps/api
    # env_file, no environment: con ${VAR:-default}: ese patron resuelve
    # contra el shell del HOST al momento de `docker compose up`, y si el
    # shell no exporto la variable gana el default y PISA lo que haya en
    # .env.local (environment: tiene prioridad sobre env_file). Esa fue la
    # causa de que JWT_SECRET_KEY llegara vacio al contenedor pese a estar
    # bien seteado en el archivo.
    env_file:
      - .env.local
    environment:
      # Wiring interno del compose, no vive en .env.local: el host/puerto
      # real de Postgres en la red de contenedores siempre es este, sin
      # importar que POSTGRES_PORT en .env.local mapee el puerto del host.
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./apps/api:/srv

  web:
    build:
      # El contexto es la raíz del monorepo porque pnpm necesita ver
      # pnpm-workspace.yaml, package.json raíz y packages/contracts.
      context: .
      dockerfile: apps/web/Dockerfile
      # El Dockerfile es multi-stage (dev/prod) desde que el stage default
      # (el último, sin --target) pasó a ser el de producción para que
      # Railway lo use tal cual. Local pide el de dev explícito.
      target: dev
    environment:
      # En el celular, el front apunta al api por la IP del host. En este
      # compose el api vive en otro contenedor, asi que usamos el nombre de
      # servicio. Para el navegador del dev en :3000, la URL es la del host.
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:${API_PORT:-8000}/api/v1}
      TZ: ${TZ:-America/Bogota}
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      - api
    volumes:
      # Bind mount para hot reload en dev.
      - ./apps/web:/srv/apps/web
      # El bind mount de arriba tapa TODO apps/web, incluido el node_modules
      # que pnpm instaló al construir la imagen. Sin este volumen anónimo
      # "de más adentro", un checkout limpio (sin node_modules en el host)
      # levanta con `next: not found`: se verificó vaciando node_modules y
      # reconstruyendo. El volumen anónimo protege esa subruta y Docker la
      # rellena con el contenido de la imagen la primera vez.
      - /srv/apps/web/node_modules

volumes:
  datos_db:
