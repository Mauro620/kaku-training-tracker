[project]
name = "rendimiento-api"
version = "0.1.0"
description = "API de la app de rendimiento personal"
requires-python = ">=3.11"
dependencies = [
    "argon2-cffi>=23.1",
    "fastapi>=0.115",
    "pydantic[email]>=2.10",
    "pyjwt[crypto]>=2.9",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic-settings>=2.7",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "httpx>=0.28",
    "ruff>=0.8",
    "mypy>=1.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM", "TCH", "RUF"]
# N815: los campos del dominio van en español y sin camelCase; la regla no aplica.
ignore = ["B008"]  # Depends() en argumentos por defecto es el idioma de FastAPI

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
# Sin esto ruff toma el paquete `alembic` por first-party, porque existe una
# carpeta alembic/ en la raíz del proyecto, y reordena mal los imports.
known-third-party = ["alembic"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
strict = true
warn_unreachable = true
files = ["app"]

# AGENTS.md exige estricto sobre services y repositories. Lo aplicamos a todo
# app/, que hoy es models y schemas, y ya cubre esas dos cuando existan.

[[tool.mypy.overrides]]
module = ["alembic.*"]
ignore_errors = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q --strict-markers"
